databases:
  - name: taskflow-postgres
    databaseName: taskflow_db
    user: taskflow_user
    plan: free

services:
  - type: web
    name: taskflow-app
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: hossenmdrafayet@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: hossenmdrafayet@gmail.com
      - key: SMTP_FROM_NAME
        value: TaskFlow
      - key: SMTP_USE_TLS
        value: "True"
      - key: DEV_MODE
        value: "False"
